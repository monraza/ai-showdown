<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>India Gate · Interactive 3D Memorial</title>
<meta name="theme-color" content="#05070d">
<style>
:root{
  --saffron:#ff9933; --green:#138808; --navy:#1a2f8f;
  --glass:rgba(16,20,32,.40); --glass-line:rgba(255,255,255,.17);
  --txt:#f6f2ea; --dim:rgba(246,242,234,.62); --accent:#ffb457;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#05070d;color:var(--txt);font-family:var(--ui);-webkit-font-smoothing:antialiased}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
canvas#c:active{cursor:grabbing}

.glass{
  background:var(--glass);
  border:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);
  box-shadow:0 12px 44px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(255,255,255,.04);
  border-radius:16px;
}
#ui{position:fixed;inset:0;pointer-events:none;transition:opacity .6s ease,transform .6s ease}
#ui.hidden{opacity:0;transform:scale(1.005)}
#ui.hidden *{pointer-events:none!important}
#ui > *{pointer-events:auto}

/* title card */
#title{position:absolute;left:max(18px,env(safe-area-inset-left));top:max(18px,env(safe-area-inset-top));padding:15px 22px 14px 20px;min-width:196px}
#title h1{font-size:19px;font-weight:650;letter-spacing:.34em;line-height:1;padding-left:2px;text-shadow:0 1px 14px rgba(0,0,0,.35)}
#title .tri{display:flex;height:5px;width:74px;margin:11px 0 9px 2px;border-radius:3px;overflow:hidden;box-shadow:0 0 14px rgba(255,153,51,.25)}
#title .tri i{flex:1;display:block}
#title .tri i:nth-child(1){background:var(--saffron)}
#title .tri i:nth-child(2){background:#fff}
#title .tri i:nth-child(3){background:var(--green)}
#title p{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);padding-left:2px;white-space:nowrap}

/* hint card */
#hint{position:absolute;right:max(18px,env(safe-area-inset-right));top:max(18px,env(safe-area-inset-top));padding:13px 17px;font-size:12px;line-height:1.75;color:var(--dim);text-align:left}
#hint b{color:var(--txt);font-weight:600}
#hint kbd{display:inline-block;min-width:20px;padding:0 6px;margin-right:2px;text-align:center;font:600 10.5px/18px var(--ui);color:var(--txt);background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.2);border-bottom-width:2px;border-radius:5px}
#hint .row{display:flex;align-items:center;gap:8px;white-space:nowrap}
#hint .row span.k{width:96px;display:inline-block}

/* bottom dock */
#dock{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;align-items:stretch;padding:8px;max-width:calc(100vw - 24px)}
.group{display:flex;align-items:center;gap:4px;padding:2px 4px;position:relative}
.group + .group{margin-left:4px;padding-left:12px}
.group + .group::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:1px;background:linear-gradient(transparent,rgba(255,255,255,.22),transparent)}
.glabel{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-right:6px;writing-mode:horizontal-tb;white-space:nowrap}
.dock-btn{
  appearance:none;border:1px solid transparent;background:transparent;color:var(--txt);cursor:pointer;
  font:500 12.5px/1 var(--ui);letter-spacing:.02em;padding:10px 13px;border-radius:11px;white-space:nowrap;
  transition:background .25s,border-color .25s,box-shadow .25s,transform .15s,color .25s;display:inline-flex;align-items:center;gap:7px;
}
.dock-btn:hover{background:rgba(255,255,255,.10)}
.dock-btn:active{transform:scale(.96)}
.dock-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.dock-btn .n{font-size:9.5px;font-weight:700;opacity:.5;border:1px solid rgba(255,255,255,.3);border-radius:4px;padding:1px 4px;line-height:1.2}
.dock-btn.on{
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.09));
  border-color:rgba(255,255,255,.38);
  box-shadow:0 0 0 1px rgba(255,255,255,.06),0 4px 22px color-mix(in srgb,var(--accent) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.3);
}
.dock-btn.on .n{opacity:.95;border-color:var(--accent);color:var(--accent)}
.dock-btn[data-mode=tricolour] .lbl{background:linear-gradient(90deg,#ff9933 0 33%,#fff 33% 66%,#2fd01d 66%);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:650}
.dock-btn .spin{width:12px;height:12px;border:1.6px solid currentColor;border-top-color:transparent;border-radius:50%;display:inline-block;opacity:.8}
.dock-btn.on .spin{animation:rot 2.4s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* toast + loader */
#toast{position:fixed;left:50%;top:max(22px,env(safe-area-inset-top));transform:translate(-50%,-12px);padding:9px 18px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:0;pointer-events:none;transition:opacity .4s,transform .4s;z-index:5;border-radius:999px}
#toast.show{opacity:1;transform:translate(-50%,0)}
#loader{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at 50% 60%,#1b2447 0%,#080b16 70%);transition:opacity 1.1s ease,visibility 1.1s;letter-spacing:.34em}
#loader.done{opacity:0;visibility:hidden}
#loader h2{font-size:22px;font-weight:600;letter-spacing:.42em;padding-left:.42em}
#loader .tri{display:flex;height:4px;width:96px;border-radius:2px;overflow:hidden}
#loader .tri i{flex:1;transform-origin:left;animation:grow 1.6s ease-in-out infinite alternate}
#loader .tri i:nth-child(1){background:var(--saffron)}
#loader .tri i:nth-child(2){background:#fff;animation-delay:.2s}
#loader .tri i:nth-child(3){background:var(--green);animation-delay:.4s}
@keyframes grow{from{transform:scaleX(.25);opacity:.5}to{transform:scaleX(1);opacity:1}}
#loader small{font-size:10.5px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase;padding-left:.22em}
#fatal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;text-align:center;padding:32px;background:#080b16;color:#ffd9a3;line-height:1.6}

@media (max-width:1180px){
  #dock{flex-direction:column;gap:2px;width:calc(100vw - 20px);max-width:620px;padding:6px 6px 7px;border-radius:18px}
  .group{overflow-x:auto;scrollbar-width:none;padding:2px 2px;justify-content:center}
  .group::-webkit-scrollbar{display:none}
  .group + .group{margin-left:0;padding-left:2px}
  .group + .group::before{display:none}
  .glabel{display:none}
  .dock-btn{padding:9px 11px;font-size:12px;flex:0 0 auto}
}
@media (max-width:820px){
  #hint{padding:9px 12px;font-size:10.5px;line-height:1.55}
  #hint .row span.k{width:auto}
  #title{padding:12px 16px 11px 15px;min-width:0}
  #title h1{font-size:15px;letter-spacing:.3em}
  #title p{display:none}
  #title .tri{margin:9px 0 0 2px}
  .group{justify-content:flex-start}
  #lightGroup{justify-content:center}
}
@media (max-width:520px){
  #hint .row:nth-child(n+3){display:none}
  #hint .row .k{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Interactive 3D model of India Gate, New Delhi"></canvas>

<div id="ui">
  <div id="title" class="glass">
    <h1>INDIA GATE</h1>
    <div class="tri"><i></i><i></i><i></i></div>
    <p>New Delhi · All India War Memorial</p>
  </div>

  <div id="hint" class="glass">
    <div class="row"><span class="k"><b>Drag</b></span><span>orbit</span></div>
    <div class="row"><span class="k"><b>Scroll</b></span><span>zoom</span></div>
    <div class="row"><span class="k"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd></span><span>lighting</span></div>
    <div class="row"><span class="k"><kbd>R</kbd></span><span>auto-orbit</span></div>
    <div class="row"><span class="k"><kbd>H</kbd></span><span>hide UI</span></div>
  </div>

  <div id="dock" class="glass">
    <div class="group" id="lightGroup" role="group" aria-label="Lighting">
      <span class="glabel">Lighting</span>
      <button class="dock-btn" data-mode="day"><span class="n">1</span><span class="lbl">Day</span></button>
      <button class="dock-btn" data-mode="golden"><span class="n">2</span><span class="lbl">Golden hour</span></button>
      <button class="dock-btn" data-mode="night"><span class="n">3</span><span class="lbl">Night</span></button>
      <button class="dock-btn" data-mode="tricolour"><span class="n">4</span><span class="lbl">Tricolour</span></button>
    </div>
    <div class="group" id="camGroup" role="group" aria-label="Camera">
      <span class="glabel">Camera</span>
      <button class="dock-btn" data-cam="front"><span class="lbl">Front</span></button>
      <button class="dock-btn" data-cam="corner"><span class="lbl">Corner</span></button>
      <button class="dock-btn" data-cam="lookup"><span class="lbl">Look up</span></button>
      <button class="dock-btn" data-cam="arch"><span class="lbl">Through arch</span></button>
      <button class="dock-btn" data-cam="rear"><span class="lbl">Rear</span></button>
      <button class="dock-btn" data-cam="aerial"><span class="lbl">Aerial</span></button>
      <button class="dock-btn" id="orbitBtn" aria-pressed="true"><span class="spin"></span><span class="lbl">Orbit</span></button>
    </div>
  </div>
</div>

<div id="toast" class="glass"></div>
<div id="loader"><h2>INDIA GATE</h2><div class="tri"><i></i><i></i><i></i></div><small id="loadMsg">Carving sandstone…</small></div>
<div id="fatal"><div><h2 style="letter-spacing:.2em;margin-bottom:10px">WebGL unavailable</h2><p>This 3D scene needs a browser with WebGL 2 enabled.</p></div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Sky } from 'three/addons/objects/Sky.js';

const nextFrame = () => new Promise(r => requestAnimationFrame(() => r()));
const $ = s => document.querySelector(s);
const setLoad = async msg => { const el = $('#loadMsg'); if (el) el.textContent = msg; await nextFrame(); await nextFrame(); };

const COARSE = matchMedia('(pointer: coarse)').matches;
const SMALL = Math.min(innerWidth, innerHeight) < 600 || (COARSE && Math.max(innerWidth, innerHeight) < 1000);

/* ───────────────────────────── renderer ───────────────────────────── */
const canvas = $('#c');
let renderer;

  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance', stencil: false });
} catch (err) {
  $('#fatal').style.display = 'flex'; $('#loader').style.display = 'none';
  throw err;
}
let PR = Math.min(window.devicePixelRatio || 1, SMALL ? 1.5 : 2);
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

renderer.outputColorSpace = THREE.SRGBColorSpace;
const MAX_ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xb8d0e6, 0.0009);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.5, 5000);
camera.position.set(64, 26, 70);

/* ───────────────────────── procedural textures ───────────────────────── */
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h || w; c.getContext('2d', { willReadFrequently: true }); return c; }

// periodic value-noise sampler on an nx × ny lattice; u,v wrap at 1 so results tile seamlessly
function noise2(nx, ny, rng) {

  const src = hc.getContext('2d').getImageData(0, 0, w, h).data;

  const out = mkCanvas(w, h), ctx = out.getContext('2d'), img = ctx.createImageData(w, h), d = img.data;
  for (let y = 0; y < h; y++) {

    for (let x = 0; x < w; x++) {
      const xm = (x - 1 + w) % w, xp = (x + 1) % w;
      const dx = (H[ym + xp] + 2 * H[y0 + xp] + H[yp + xp]) - (H[ym + xm] + 2 * H[y0 + xm] + H[yp + xm]);
      const dy = (H[yp + xm] + 2 * H[yp + x] + H[yp + xp]) - (H[ym + xm] + 2 * H[ym + x] + H[ym + xp]);
      let nx = -dx * strength * .25, ny = dy * strength * .25, nz = 1;

const hex2rgb = h => { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; };

// Sandstone block-work: returns colour + normal textures (one tile = 4 m of wall)
function stoneSet(size, baseHex, o = {}) {
  const { rows = 8, cols = 0, seed = 1, lightJit = .07, hueJit = .025, jointA = .55, nStrength = 2.4, strata = 1, mott = 1 } = o;
  const rng = rngOf(seed), br = hex2rgb(baseHex);
  const col = mkCanvas(size), hgt = mkCanvas(size), cx = col.getContext('2d'), hx = hgt.getContext('2d');
  const rowH = size / rows, jw = Math.max(2, Math.round(size / 300));
  for (let r = 0; r < rows; r++) {
    const y = Math.round(r * rowH), y2 = Math.round((r + 1) * rowH), widths = [];
    if (cols) for (let i = 0; i < cols; i++) widths.push(size / cols);
    else { let rem = size; while (rem > 1) { let w = (.2 + .22 * rng()) * size; if (rem - w < .15 * size) w = rem; widths.push(w); rem -= w; } }

      const x0 = Math.round(x), x1 = Math.round(x + w);

      const hv = 130 + rng() * 50 | 0; hx.fillStyle = `rgb(${hv},${hv},${hv})`; hx.fillRect(x0, y, x1 - x0, y2 - y);
      cx.fillStyle = `rgba(32,14,8,${jointA})`; cx.fillRect(x0, y, x1 - x0, jw); cx.fillRect(x0, y, jw, y2 - y);
      hx.fillStyle = 'rgb(28,28,28)'; hx.fillRect(x0, y, x1 - x0, jw); hx.fillRect(x0, y, jw, y2 - y);

  }
  const fb = fbm2(5, 5, rng), fm = fbm2(2, 4, rng), st = noise2(5, Math.max(8, rows * 12), rng), fine = noise2(size >> 2, size >> 2, rng);
  const ci = cx.getImageData(0, 0, size, size), cd = ci.data, hi = hx.getImageData(0, 0, size, size), hd = hi.data;

function grassTex(size, seed) {

  const fb = fbm2(4, 5, rng), fine = noise2(size >> 1, size >> 1, rng), img = x.createImageData(size, size), d = img.data;
  for (let y = 0; y < size; y++) for (let xx = 0; xx < size; xx++) {
    const u = xx / size, v = y / size, n = fb(u, v), f = fine(u, v), i = (y * size + xx) * 4;
    d[i] = 72 + 38 * n + 16 * f; d[i + 1] = 100 + 44 * n + 26 * f; d[i + 2] = 36 + 16 * n + 8 * f; d[i + 3] = 255;

  }

function speckleTex(size, base, amp, seed, specks = .004) {
  const rng = rngOf(seed), c = mkCanvas(size), x = c.getContext('2d'), img = x.createImageData(size, size), d = img.data;
  const fb = fbm2(6, 4, rng), fine = noise2(size >> 1, size >> 1, rng);
  for (let y = 0; y < size; y++) for (let xx = 0; xx < size; xx++) {

/* ═══════════════════════════ THE GATE ═══════════════════════════ */
const GATE_H = 42;
const G = { hw: 16.2, hd: 10.2, B: .9, SP: 18.2, AR: 4.6 };   // shaft half-width / half-depth, passage floor, arch spring, arch radius
const gate = new THREE.Group(); gate.name = 'IndiaGate';
function buildGate() {

  // low red-sandstone plinth, two shallow steps

  const shaft = new THREE.ExtrudeGeometry(archBlockShape(hw, B, 28, AR, SP), { depth: 2 * hd, bevelEnabled: false, curveSegments: 64, steps: 1 });
  shaft.translate(0, 0, -hd); F.push(shaft);

  for (const sx of [-1, 1]) for (const sz of [-1, 1]) F.push(boxG(1.3, SP - B, .34, sx * (AR + .65), (B + SP) / 2, sz * (hd + .17)));
  for (const zs of [1, -1]) {

  for (let k = 0; k <= nF; k++) for (const sz of [-1, 1]) F.push(boxG(.62, .92, .78, -hw + k * pF, 28.5, sz * (hd + .39)));
  for (let k = 0; k <= nS; k++) for (const sx of [-1, 1]) F.push(boxG(.78, .92, .62, sx * (hw + .39), 28.5, -hd + k * pS));

  F.push(boxG(2 * (hw + 1.3), .55, 2 * (hd + 1.3), 0, 29.275, 0));

/* ───────── INDIA lettering: real incised 3D letters ───────── */
function letterShapes() {
  const arc = (cx, cy, r, a0, a1, n) => { const o = []; for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; o.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } return o; };
  const I = { w: .5, outer: [[0, 0], [.5, 0], [.5, .08], [.35, .08], [.35, .92], [.5, .92], [.5, 1], [0, 1], [0, .92], [.15, .92], [.15, .08], [0, .08]] };
  const N = { w: .95, outer: [[0, 0], [.17, 0], [.17, .6], [.78, 0], [.95, 0], [.95, 1], [.78, 1], [.78, .4], [.17, 1], [0, 1]] };
  const D = { w: .95, outer: [[0, 0], [.45, 0], ...arc(.45, .5, .5, -Math.PI / 2, Math.PI / 2, 20).slice(1), [0, 1]], counter: [[.17, .13], [.45, .13], ...arc(.45, .5, .37, -Math.PI / 2, Math.PI / 2, 20).slice(1), [.17, .87]] };
  const A = { w: 1.05, outer: [[0, 0], [.2, 0], [.3, .24], [.745, .24], [.85, 0], [1.05, 0], [.61, 1], [.44, 1]], counter: [[.355, .36], [.695, .36], [.525, .72]] };
  return [I, N, D, I, A];
}
function buildInscription(g, z, y) {
  const capH = 1.15, gap = .24, L = letterShapes(), total = (L.reduce((s, l) => s + l.w, 0) + gap * (L.length - 1)) * capH;
  const slabW = 11.4, slabH = 2.5, depth = .3;
  const slab = new THREE.Shape([new THREE.Vector2(-slabW / 2, -slabH / 2), new THREE.Vector2(slabW / 2, -slabH / 2), new THREE.Vector2(slabW / 2, slabH / 2), new THREE.Vector2(-slabW / 2, slabH / 2)]);
  const counters = []; let x = -total / 2;
  const tr = (pts, ox, oy) => pts.map(p => new THREE.Vector2(p[0] * capH + ox, p[1] * capH + oy));
  for (const l of L) {
    slab.holes.push(new THREE.Path(tr(l.outer, x, -capH / 2)));
    if (l.counter) counters.push(new THREE.Shape(tr(l.counter, x, -capH / 2)));
    x += (l.w + gap) * capH;
  }
  const opt = { depth, bevelEnabled: false, curveSegments: 12 };
  const sg = new THREE.ExtrudeGeometry(slab, opt); sg.translate(0, 0, .012);
  const parts = [sg]; for (const c of counters) { const cg = new THREE.ExtrudeGeometry(c, opt); cg.translate(0, 0, .012); parts.push(cg); }
  const grp = new THREE.Group(); grp.position.set(0, y, z); g.add(grp);
  mergeMesh(parts, M.buff, grp);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(slabW, slabH), M.shade); floor.position.z = .014; floor.receiveShadow = true; grp.add(floor);
  // raised tablet border
  const fr = []; const t = .2, p = .12;
  fr.push(boxG(slabW + t * 2, t, p + depth, 0, slabH / 2 + t / 2, (p + depth) / 2), boxG(slabW + t * 2, t, p + depth, 0, -slabH / 2 - t / 2, (p + depth) / 2), boxG(t, slabH, p + depth, slabW / 2 + t / 2, 0, (p + depth) / 2), boxG(t, slabH, p + depth, -slabW / 2 - t / 2, 0, (p + depth) / 2));
  mergeMesh(fr, M.buff, grp);
}

function buildFaces() {
  const { hw, hd } = G;
  const frame = (list, w, h, cx, cy, z, t = .18, d = .16) => {
    list.push(boxG(w + t * 2, t, d, cx, cy + h / 2 + t / 2, z + d / 2), boxG(w + t * 2, t, d, cx, cy - h / 2 - t / 2, z + d / 2), boxG(t, h, d, cx + w / 2 + t / 2, cy, z + d / 2), boxG(t, h, d, cx - w / 2 - t / 2, cy, z + d / 2));
  };
  const medallion = (g, fr, mat, r, x, y, z) => {
    const m = new THREE.Mesh(new THREE.CircleGeometry(r, 64), mat); m.position.set(x, y, z + .03); m.receiveShadow = true; g.add(m);
    const rim = new THREE.TorusGeometry(r * 1.07, r * .09, 12, 64); rim.translate(x, y, z + .06); fr.push(rim);
  };
  // ---- front / rear faces (local +Z is outwards) ----
  const mkFront = () => {
    const g = new THREE.Group(), fr = [];
    const plane = (w, h, mat, x, y, z) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat); m.position.set(x, y, z); m.receiveShadow = true; g.add(m); return m; };
    // attic: INDIA tablet between two dated medallions, dedication band below
    buildInscription(g, 7.2, 37.25);
    medallion(g, fr, M.medL, 1.34, -7.15, 37.25, 7.2); medallion(g, fr, M.medR, 1.34, 7.15, 37.25, 7.2);
    plane(25.4, 1.9, M.dedic, 0, 33.85, 9.4 + .02);
    // shaft: plain sun-disc medallions and recessed name tablets
    for (const s of [-1, 1]) {
      medallion(g, fr, M.disc, 1.5, s * 11.2, 23.4, hd);
      plane(5.0, 2.5, M.names, s * 10.7, 15.95, hd + .02); frame(fr, 5.0, 2.5, s * 10.7, 15.95, hd);
    }
    mergeMesh(fr, M.buff, g);
    return g;
  };
  const f1 = mkFront(); gate.add(f1);
  const f2 = f1.clone(); f2.rotation.y = Math.PI; gate.add(f2);

  // ---- side faces ----
  const mkSide = () => {
    const g = new THREE.Group(), fr = [];
    const plane = (w, h, mat, x, y, z) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat); m.position.set(x, y, z); m.receiveShadow = true; g.add(m); return m; };
    medallion(g, fr, M.disc, 1.5, 0, 23.4, hw);
    plane(8.0, 2.6, M.names, 0, 15.95, hw + .02); frame(fr, 8.0, 2.6, 0, 15.95, hw);

  };
  const s1 = mkSide(); s1.rotation.y = Math.PI / 2; gate.add(s1);
  const s2 = mkSide(); s2.rotation.y = -Math.PI / 2; gate.add(s2);
}

/* ───────── red sandstone bollards, sagging chains and clipped hedges round the base ───────── */
function buildFence() {
  const { hd } = G, ZR = hd + 4.4, XR = 21.25;
  const pts = [];
  for (const sz of [-1, 1]) for (const x of [-21.25, -12.75, -4.25, 4.25, 12.75, 21.25]) pts.push([x, sz * ZR]);
  for (const sx of [-1, 1]) pts.push([sx * XR, 0]);
  const prof = [[.001, 0], [.28, 0], [.28, .16], [.2, .22], [.17, .62], [.23, .68], [.23, .8], [.15, .86], [.15, 1.0], [.22, 1.08], [.18, 1.28], [.001, 1.34]].map(p => new THREE.Vector2(p[0], p[1]));
  const bol = new THREE.InstancedMesh(new THREE.LatheGeometry(prof, 14), M.bollard, pts.length); bol.castShadow = bol.receiveShadow = true;
  const o = new THREE.Object3D(); pts.forEach(([x, z], i) => { o.position.set(x, 0, z); o.updateMatrix(); bol.setMatrixAt(i, o.matrix); }); gate.add(bol);
  const links = [];
  const row = z => { for (let i = 0; i < 5; i++) links.push([[-21.25 + i * 8.5, z], [-12.75 + i * 8.5, z]]); };
  row(ZR); row(-ZR);
  for (const sx of [-1, 1]) { links.push([[sx * XR, -ZR], [sx * XR, 0]]); links.push([[sx * XR, 0], [sx * XR, ZR]]); }
  const tubes = [];
  for (const [[x0, z0], [x1, z1]] of links) {
    const c = [], n = 7; for (let i = 0; i <= n; i++) { const t = i / n, sag = .42 * (1 - Math.pow(2 * t - 1, 2)); c.push(new THREE.Vector3(x0 + (x1 - x0) * t, 1.02 - sag, z0 + (z1 - z0) * t)); }
    tubes.push(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(c), 14, .035, 5, false));
  }
  const ch = new THREE.Mesh(mergeGeometries(tubes, false), M.iron); ch.castShadow = true; gate.add(ch);
  // hedges either side of the passage, tight against the plinth
  for (const sz of [-1, 1]) for (const sx of [-1, 1]) {
    const hg = new RoundedBoxGeometry(9.8, .95, 1.5, 4, .3); hg.translate(sx * 10.8, .47, sz * (hd + 3.0));
    const m = new THREE.Mesh(hg, M.hedge); m.castShadow = m.receiveShadow = true; gate.add(m);
  }
}

/* ───────── Amar Jawan Jyoti under the arch: marble cenotaph, reversed rifle, helmet, four flames ───────── */

  const s = new THREE.Sprite(mat); s.position.set(x, y, z); s.scale.set(w, h, 1); s.center.set(.5, .12); parent.add(s);

}
function buildJyoti(B) {

  const urn = new THREE.LatheGeometry([[.001, 0], [.24, 0], [.3, .22], [.36, .5], [.42, .66], [.34, .66], [.001, .52]].map(p => new THREE.Vector2(p[0], p[1])), 24);
  for (const [sx, sz] of [[1, 1], [-1, 1], [1, -1], [-1, -1]]) {

    const rim = add(new THREE.TorusGeometry(.4, .035, 8, 24), M.gold, sx * 2.15, 1.11, sz * 2.15); rim.rotation.x = Math.PI / 2;
    makeFlame(g, sx * 2.15, 1.05, sz * 2.15, 1.1, 2.0, sx * 3 + sz);
  }
  const l = new THREE.PointLight(0xff9a42, 0, 34, 1.5); l.position.set(0, B + 3.4, 0); gate.add(l); LIGHTS.jyoti = l;
  const l2 = new THREE.PointLight(0xffb870, 0, 30, 1.4); l2.position.set(0, B + 14, 0); gate.add(l2); LIGHTS.vault = l2;
}
function buildBowlFire() {
  const g = new THREE.Group(); g.position.set(0, 41.62 + .45, 0); gate.add(g); LIGHTS.bowlGroup = g;
  for (let i = 0; i < 7; i++) { const a = i / 7 * TAU, r = i ? 1.15 : 0; makeFlame(g, Math.cos(a) * r, 0, Math.sin(a) * r, 2.1 + (i ? 0 : 1.2), 3.7 + (i ? 0 : 2.1), i * 1.7).userData.bowl = true; }
  const ember = new THREE.Mesh(new THREE.CircleGeometry(2.7, 40), new THREE.MeshBasicMaterial({ color: 0xff6a1a, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false })); ember.rotation.x = -Math.PI / 2; ember.position.y = .02; g.add(ember); LIGHTS.ember = ember;
  const l = new THREE.PointLight(0xff8a3a, 0, 70, 1.6); l.position.set(0, 3, 0); g.add(l); LIGHTS.bowl = l;

tickers.push((t) => {
  const night = U.night.value;
  for (const f of flameSprites) {
    const k = Math.sin(t * 9 + f.seed * 3.1) * .5 + Math.sin(t * 15.3 + f.seed * 1.7) * .3 + Math.sin(t * 23 + f.seed) * .2;
    const bowl = f.s.userData.bowl, vis = bowl ? smooth(.25, .9, night) : 1;
    f.s.scale.set(f.w * (1 + .1 * k) * (.2 + .8 * vis), f.h * (1 + .22 * k) * (.2 + .8 * vis), 1);
    f.s.material.opacity = (bowl ? .95 : .85) * vis * (.9 + .1 * k);
    f.s.material.rotation = k * .06;
  }
  if (LIGHTS.jyoti) {
    const k = Math.sin(t * 11) * .5 + Math.sin(t * 17.3 + 1) * .5;
    LIGHTS.jyoti.intensity = (8 + 60 * night) * (1 - .62 * U.tri.value) * (1 + .12 * k);
    LIGHTS.vault.intensity = (42 * night * (1 - .95 * U.tri.value) + 1.2 * U.tri.value) * (1 + .03 * k);
    LIGHTS.bowl.intensity = 240 * smooth(.25, .9, night) * (1 + .1 * k);
    LIGHTS.ember.material.opacity = .85 * smooth(.25, .9, night) * (.85 + .15 * k);
  }
});

/* ───────── ground, plaza, avenue, canals ───────── */
const WaterShader = {

    uTint: { value: new THREE.Color(0x1f4d4a) }, uFogColor: { value: new THREE.Color() }, uFogDensity: { value: .001 }, uHasRefl: { value: 1 },

    void main(){ vUv = textureMatrix * vec4(position, 1.0); vec4 wp = modelMatrix * vec4(position, 1.0); vWPos = wp.xyz; gl_Position = projectionMatrix * viewMatrix * wp; }`,
  fragmentShader: `uniform vec3 color; uniform sampler2D tDiffuse; uniform float uTime; uniform vec3 uTint, uFogColor, uSkyLow, uSkyHigh, uGlint; uniform float uFogDensity, uHasRefl;
    varying vec4 vUv; varying vec3 vWPos;

function buildGround() {

  { const p = fol.attributes.position, c = new Float32Array(p.count * 3); for (let i = 0; i < p.count; i++) { const k = clamp((p.getY(i) - 1.5) / 8, 0, 1), s = .42 + .78 * k, n = .9 + .2 * Math.sin(p.getX(i) * 4.1 + p.getZ(i) * 3.3); c[i * 3] = .74 * s * n; c[i * 3 + 1] = 1 * s; c[i * 3 + 2] = .5 * s * n; } fol.setAttribute('color', new THREE.BufferAttribute(c, 3)); }

  fmat.onBeforeCompile = sh => {
    sh.uniforms.uTime = U.time;
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nuniform float uTime; varying vec3 vObjP;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>

  const tmat = new THREE.MeshStandardMaterial({ color: 0x4a3524, roughness: 1 });

  for (let z = 70; z < 335; z += SMALL ? 22 : 13) for (const s of [-1, 1]) for (const cx of [27, 37]) { const x = s * (cx + rng() * 3), zz = z + rng() * 6; pts.push([x, zz, .95 + rng() * .5]); }
  for (let i = 0; i < (SMALL ? 40 : 110); i++) { const a = rng() * TAU, r = 64 + rng() * 70; const x = Math.cos(a) * r, z = Math.sin(a) * r; if (free(x, z)) pts.push([x, z, .8 + rng() * .7]); }
  for (let i = 0; i < (SMALL ? 20 : 54); i++) { const a = rng() * TAU, r = 42 + rng() * 36; const x = Math.cos(a) * r, z = -100 + Math.sin(a) * r; if (free(x, z) && Math.hypot(x, z + 100) > 38) pts.push([x, z, .8 + rng() * .7]); }
  for (let i = 0; i < (SMALL ? 40 : 120); i++) { const a = rng() * TAU, r = 150 + rng() * 360; const x = Math.cos(a) * r, z = Math.sin(a) * r; if (free(x, z) && !(Math.abs(x) < 40 && z > 0)) pts.push([x, z, 1 + rng() * 1.1]); }

let composer, bloom, smaa;
function buildComposer() {
  const rt = new THREE.WebGLRenderTarget(innerWidth * PR, innerHeight * PR, { type: THREE.HalfFloatType });
  composer = new EffectComposer(renderer, rt);
  composer.setPixelRatio(PR); composer.setSize(innerWidth, innerHeight);

  bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .3, .6, .9);

  composer.addPass(smaa);
}

    uniforms: { uHorizon: { value: new THREE.Color() }, uZenith: { value: new THREE.Color() }, uMoonDir: { value: ENV.moonDir }, uOpacity: { value: 0 }, uMoon: { value: 0 } },

  if (instant) { for (const k of NUM) LIVE[k] = to[k]; for (const k of COL) LIVE[k].copy(to[k]); trans = null; applyLive(); if (pmrem) refreshEnv(); return; }
  const from = {}; for (const k of NUM) from[k] = LIVE[k]; for (const k of COL) from[k] = LIVE[k].clone();
  trans = { from, to, t: 0, dur: 2.4, env: 0 };
}
function stepLighting(dt) {
  if (!trans) return;
  trans.t += dt / trans.dur; const t = clamp(trans.t, 0, 1), e = easeCubic(t), { from, to } = trans;
  for (const k of NUM) LIVE[k] = AZ.has(k) ? lerpAngle(from[k], to[k], e) : lerp(from[k], to[k], e);
  for (const k of COL) LIVE[k].copy(from[k]).lerp(to[k], e);
  applyLive(); trans.env += dt;
  if (t >= 1) { trans = null; refreshEnv(); } else if (trans.env > .6) { trans.env = 0; refreshEnv(); }
}

/* ═══════════════════════ CAMERA + CONTROLS ═══════════════════════ */
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = .06; controls.enablePan = false;
controls.minDistance = 10; controls.maxDistance = 280; controls.rotateSpeed = .7; controls.zoomSpeed = .8;
controls.autoRotate = true; controls.autoRotateSpeed = .7;
controls.target.set(0, 19, -2);
const CAMS = {
  front: { pos: [0, 13, 82], tgt: [0, 19, 0] },
  corner: { pos: [60, 23, 58], tgt: [0, 19, -2] },
  lookup: { pos: [9, 2.4, 25], tgt: [0, 30, 0] },
  arch: { pos: [0, 5.4, 20], tgt: [0, 10, -45] },
  rear: { pos: [0, 13, -70], tgt: [0, 19, 0] },
  aerial: { pos: [78, 108, 98], tgt: [0, 6, -30] }
};
let tween = null, curCam = 'corner';
const _o = new THREE.Vector3();
function flyTo(name, { instant = false } = {}) {
  const c = CAMS[name]; if (!c) return;
  curCam = name; setAuto(false);
  document.querySelectorAll('[data-cam]').forEach(b => b.classList.toggle('on', b.dataset.cam === name));
  const t1 = new THREE.Vector3(...c.tgt), p1 = new THREE.Vector3(...c.pos);
  // portrait screens see far less horizontally, so back the camera off to keep the monument framed
  const asp = innerWidth / Math.max(1, innerHeight);
  if (asp < 1.15 && name !== 'lookup') { const f = Math.min(2.2, Math.pow(1.15 / asp, .8)); p1.sub(t1).multiplyScalar(f).add(t1); if (name === 'corner' || name === 'rear') p1.y += (f - 1) * 40; const d = p1.distanceTo(t1); if (d > 268) p1.sub(t1).multiplyScalar(268 / d).add(t1); }
  if (instant) { camera.position.copy(p1); controls.target.copy(t1); controls.update(); tween = null; return; }
  const p0 = camera.position.clone(), t0 = controls.target.clone();
  const s0 = new THREE.Spherical().setFromVector3(_o.copy(p0).sub(t0)), s1 = new THREE.Spherical().setFromVector3(_o.copy(p1).sub(t1));
  let dth = s1.theta - s0.theta; dth = ((dth + Math.PI) % TAU + TAU) % TAU - Math.PI;
  tween = { t: 0, dur: 1.8, t0, t1, s0, s1, dth };
}
const _s = new THREE.Spherical();
function stepTween(dt) {
  if (!tween) return;
  tween.t += dt / tween.dur; const k = clamp(tween.t, 0, 1), e = easeCubic(k), { t0, t1, s0, s1, dth } = tween;
  controls.target.lerpVectors(t0, t1, e);
  _s.set(lerp(s0.radius, s1.radius, e), lerp(s0.phi, s1.phi, e), s0.theta + dth * e);
  camera.position.setFromSpherical(_s).add(controls.target);
  if (k >= 1) tween = null;
}
function setAuto(v) {
  controls.autoRotate = !!v;
  const b = $('#orbitBtn'); b.classList.toggle('on', !!v); b.setAttribute('aria-pressed', !!v);
  if (v) document.querySelectorAll('[data-cam]').forEach(x => x.classList.remove('on'));
}
// dragging the scene stops auto-orbit and any running camera tween
let down = null;
canvas.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; tween = null; });
addEventListener('pointermove', e => { if (down && (e.buttons || e.pointerType === 'touch') && Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 4) { if (controls.autoRotate) setAuto(false); document.querySelectorAll('[data-cam]').forEach(x => x.classList.remove('on')); } });
addEventListener('pointerup', () => { down = null; });
canvas.addEventListener('wheel', () => { tween = null; }, { passive: true });

/* ═══════════════════════ UI ═══════════════════════ */
let toastTimer = 0;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1700); }
function toggleUI() { const ui = $('#ui'); const hide = !ui.classList.contains('hidden'); ui.classList.toggle('hidden', hide); if (hide) toast('Press H to show the interface'); }
document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => { setMode(b.dataset.mode); b.blur(); }));
document.querySelectorAll('[data-cam]').forEach(b => b.addEventListener('click', () => { flyTo(b.dataset.cam); b.blur(); }));
$('#orbitBtn').addEventListener('click', e => { setAuto(!controls.autoRotate); tween = null; e.currentTarget.blur(); });
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k >= '1' && k <= '4') setMode(MODE_ORDER[+k - 1]);
  else if (k === 'r') { setAuto(!controls.autoRotate); tween = null; }
  else if (k === 'h') toggleUI();
});

/* ═══════════════════════ RESIZE / ADAPTIVE QUALITY ═══════════════════════ */
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setPixelRatio(PR); renderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  composer.setPixelRatio(PR); composer.setSize(w, h); if (smaa) smaa.enabled = PR < 1.75;
  if (ENV.water && ENV.water.getRenderTarget) ENV.water.getRenderTarget().setSize(Math.max(256, Math.floor(w * PR * .5)), Math.max(256, Math.floor(h * PR * .5)));
}
addEventListener('resize', resize);
let slow = 0, adapt = true;
function adaptQuality(dt) {
  if (!adapt) return;
  if (dt > .036) slow++; else slow = Math.max(0, slow - 2);
  if (slow > 80 && PR > .65) { PR = Math.max(.65, PR - .2); slow = 0; resize(); }
}

/* ═══════════════════════ MAIN ═══════════════════════ */
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), .1), t = clock.elapsedTime;
  U.time.value = t;
  stepTween(dt); controls.update(dt);
  if (camera.position.y < 1.3) camera.position.y = 1.3;
  stepLighting(dt);
  for (const f of tickers) f(t, dt);
  composer.render();
  adaptQuality(dt);
  requestAnimationFrame(frame);
}

async function init() {
  await makeAssets();
  await buildWorld();
  await setLoad('Lighting the memorial…');
  buildNightDome(); buildComposer(); buildEnvMap();
  setMode('golden', { instant: true, silent: true });
  setAuto(true);
  controls.update();
  window.__app = { THREE, scene, camera, renderer, controls, composer, setMode, flyTo, setAuto, toggleUI, LIVE, ENV, U, noAdapt: () => { adapt = false; }, get ready() { return true; } };
  for (let i = 0; i < 3; i++) await nextFrame();
  frame();
  await nextFrame(); await nextFrame();
  $('#loader').classList.add('done');
  window.__ready = true;
}
init().catch(err => { console.error(err); const f = $('#fatal'); f.style.display = 'flex'; f.querySelector('p').textContent = 'Something went wrong while building the scene: ' + (err && err.message || err); $('#loader').style.display = 'none'; });

</script>
</body>
