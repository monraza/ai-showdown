/* ───────────────────────── sky, stars, moon, clouds, haze ───────────────────────── */

const starU = { uTime: U.uTime, uOpacity: { value: 0 }, uPR: { value: renderer.getPixelRatio() } };

const moonMat = new THREE.SpriteMaterial({ map: moonTexture(), transparent: true, opacity: 0, depthWrite: false, fog: false });

const hazeMat = new THREE.MeshBasicMaterial({ map: rampTexture([[0, 0], [0.45, 0.16], [0.8, 0.7], [1, 1]]), transparent: true, side: THREE.BackSide, depthWrite: false, fog: false });
const haze = new THREE.Mesh(new THREE.CylinderGeometry(2550, 2550, 440, 48, 1, true), hazeMat); haze.position.y = 212; haze.renderOrder = -2; scene.add(haze);
const cloudMat = new THREE.SpriteMaterial({ map: cloudTexture(), transparent: true, depthWrite: false, fog: false });

for (let i = 0; i < (LITE ? 9 : 16); i++) {

/* tricolour searchlights and the flame in the crowning bowl */
const beamTex = rampTexture([[0, 0], [0.5, 0.22], [1, 0.95]]), beams = new THREE.Group(), beamMats = [];
[[-34, -30, [1.0, 0.42, 0.06]], [0, -46, [1.0, 0.98, 0.92]], [34, -30, [0.08, 0.9, 0.16]]].forEach(([x, z, c]) => {

beams.visible = false; scene.add(beams);
const flameMat = new THREE.SpriteMaterial({ map: glowTex, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, fog: false });

/* soaring kites (the feathered kind) over the lawns */
const FLOCK = LITE ? 12 : 26, flock = [], birdDummy = new THREE.Object3D(); birdDummy.rotation.order = 'YXZ';

const birds = (() => {

/* ───────────────────────── lights ───────────────────────── */
const hemi = new THREE.HemisphereLight(0xffffff, 0x888888, 1); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 3), SHC = new THREE.Vector3(0, 0, -45);
sun.castShadow = true; sun.shadow.mapSize.setScalar(LITE ? 2048 : 4096);
Object.assign(sun.shadow.camera, { left: -140, right: 140, top: 140, bottom: -140, near: 60, far: 900 });

const archLight = new THREE.PointLight(0xffc27a, 0, 60, 1); archLight.position.set(0, 1.8, 0); scene.add(archLight);
const canopyLight = new THREE.PointLight(0xffd29a, 0, 60, 1); canopyLight.position.set(0, 11, CZ + 4); scene.add(canopyLight);

/* ───────────────────────── lighting modes ───────────────────────── */
const NIGHT = { gain: 1, sunEl: -16, sunAz: -9.5, keyEl: 21, keyAz: -155, turb: 2, ray: 0.3, mie: 0.002, mieG: 0.8, night: 1, key: '#a9bfff', keyI: 0.55,
  hemiS: '#42528a', hemiG: '#14161e', hemiI: 1.5, fog: '#0c1224', fogD: 0.0017, zen: '#04060f', expo: 0.95, blS: 0.55, blR: 0.65, blT: 0.7,
  lamp: 1, flood: 1, tri: 0, cloud: '#39446a', cloudA: 0.4, water: '#0c1a28', birds: 0, jetA: [1.15, 0.86, 0.5], jetB: [1.15, 0.86, 0.5] };
const LOOKS = {
  day: { gain: 0.32, sunEl: 46, sunAz: -35, keyEl: 46, keyAz: -35, turb: 4, ray: 2.5, mie: 0.004, mieG: 0.8, night: 0, key: '#fff1d8', keyI: 5.0,
    hemiS: '#c3d6f5', hemiG: '#b09a78', hemiI: 0.95, fog: '#bccde0', fogD: 0.00105, zen: '#0a1230', expo: 0.6, blS: 0.14, blR: 0.4, blT: 1.0,
    lamp: 0, flood: 0, tri: 0, cloud: '#ffffff', cloudA: 0.92, water: '#3f7387', birds: 1, jetA: [0.93, 0.97, 1.0], jetB: [0.93, 0.97, 1.0] },
  golden: { gain: 1, sunEl: 3.6, sunAz: -9.5, keyEl: 22, keyAz: -50, turb: 8, ray: 2.6, mie: 0.01, mieG: 0.88, night: 0, key: '#ffdcb6', keyI: 4.0,
    hemiS: '#8c93c6', hemiG: '#6a5040', hemiI: 0.8, fog: '#e0a67a', fogD: 0.0015, zen: '#141a3c', expo: 0.8, blS: 0.14, blR: 0.6, blT: 1.1,
    lamp: 0.3, flood: 0, tri: 0, cloud: '#ffb590', cloudA: 0.95, water: '#6a5560', birds: 1, jetA: [1.0, 0.86, 0.72], jetB: [1.0, 0.86, 0.72] },
  night: NIGHT,
  tri: { ...NIGHT, keyI: 0.4, hemiI: 1.1, expo: 0.92, blS: 0.5, blT: 0.75, flood: 0.06, tri: 1, cloudA: 0.3, jetA: [1.35, 0.5, 0.07], jetB: [0.1, 1.05, 0.2] }
};
for (const L of Object.values(LOOKS)) for (const k in L) {

}
const cloneLook = L => Object.fromEntries(Object.entries(L).map(([k, v]) => [k, v.isColor ? v.clone() : v]));
const sunDir = new THREE.Vector3(), keyDir = new THREE.Vector3();
const dirFrom = (el, az, out) => out.set(Math.sin(deg(az)) * Math.cos(deg(el)), Math.sin(deg(el)), Math.cos(deg(az)) * Math.cos(deg(el)));
function applyLook(L) {

  skyU.uGain.value = L.gain; skyU.turbidity.value = L.turb; skyU.rayleigh.value = L.ray; skyU.mieCoefficient.value = L.mie; skyU.mieDirectionalG.value = L.mieG;
  sun.position.copy(SHC).addScaledVector(dirFrom(L.keyEl, L.keyAz, keyDir), 450); sun.color.copy(L.key); sun.intensity = L.keyI;
  hemi.color.copy(L.hemiS); hemi.groundColor.copy(L.hemiG); hemi.intensity = L.hemiI;
  scene.fog.color.copy(L.fog); scene.fog.density = L.fogD; hazeMat.color.copy(L.fog);
  domeU.uOpacity.value = L.night; domeU.uHorizon.value.copy(L.fog); domeU.uZenith.value.copy(L.zen);

  U.uFlood.value = L.flood; U.uTri.value = L.tri;
  lensMat.color.setRGB(0.03 + 3 * L.flood, 0.03 + 2 * L.flood, 0.03 + 0.9 * L.flood); floodPoolMat.opacity = L.flood * 0.45; floodPoolMat.visible = L.flood > 0.002;

  cloudMat.color.copy(L.cloud); cloudMat.opacity = L.cloudA; matWater.color.copy(L.water);
  birdMat.opacity = L.birds; birds.visible = L.birds > 0.02;

const look = cloneLook(LOOKS.golden);
let lookFrom = null, lookTo = null, lookT = 1, lookName = 'golden';
const lookBtns = [...document.querySelectorAll('[data-look]')];
function setLook(name) {
  if (!LOOKS[name]) return;
  lookName = name; lookFrom = cloneLook(look); lookTo = LOOKS[name]; lookT = 0;
  lookBtns.forEach(b => b.classList.toggle('on', b.dataset.look === name));
}
applyLook(look); lookBtns.forEach(b => b.classList.toggle('on', b.dataset.look === lookName));

/* ───────────────────────── camera presets ───────────────────────── */
const VIEWS = {
  front: [[0, 7.5, 132], [0, 18.5, 0]], corner: [[63, 3.6, 70], [0, 19, 0]], lookup: [[6.5, 2.3, 25], [0, 27, 0]],
  through: [[0, 3.2, 62], [0, 11, CZ]], rear: [[22, 11, -204], [0, 15, -30]], aerial: [[98, 150, 156], [0, 4, -24]]
};
const orbitBtn = document.getElementById('orbit');
let fly = null;
function setOrbit(on) { controls.autoRotate = on; orbitBtn.classList.toggle('on', on); }
function flyTo(name) {
  const v = VIEWS[name]; if (!v) return;

  const p0 = camera.position, a0 = Math.atan2(p0.x, p0.z), a1 = Math.atan2(v[0][0], v[0][2]);
  fly = { t: 0, a0, da: ((a1 - a0 + Math.PI * 3) % TAU) - Math.PI, r0: Math.hypot(p0.x, p0.z), r1: Math.hypot(v[0][0], v[0][2]), y0: p0.y, y1: v[0][1],
    t0: controls.target.clone(), t1: new THREE.Vector3(...v[1]) };
}
setOrbit(true);
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => flyTo(b.dataset.view)));
lookBtns.forEach(b => b.addEventListener('click', () => setLook(b.dataset.look)));
orbitBtn.addEventListener('click', () => setOrbit(!controls.autoRotate));

renderer.domElement.addEventListener('wheel', () => { fly = null; }, { passive: true });
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;

  if (k >= '1' && k <= '4' && k.length === 1) setLook(['day', 'golden', 'night', 'tri'][+k - 1]);

  else if (k === 'h') document.body.classList.toggle('hide-ui');

/* ───────────────────────── resize + loop ───────────────────────── */
function resize() {
  const w = innerWidth, h = innerHeight;

  U.uScale.value = buf.y * 0.5 / Math.tan(deg(camera.fov) * 0.5);
}
addEventListener('resize', () => { pr = PR_MAX; slow = 0; resize(); }); resize();

const clock = new THREE.Clock();
