<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Play · India Gate AI Showdown</title>
<meta name="description" content="Play the India Gate 3D scenes built by Claude Sonnet 5.5, Opus 5.5 and Fable 5.2 from the same prompt.">
<meta property="og:title" content="Same prompt. 3 Claude models. Which built India Gate best?">
<meta property="og:image" content="https://monraza.github.io/ai-showdown/india-gate/media/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://monraza.github.io/ai-showdown/india-gate/media/og.jpg">
<meta name="theme-color" content="#0b0d12">
<style>
:root{--bg:#0b0d12;--line:#232a36;--text:#f2efe6;--muted:#a3a9b6;--sonnet:#38c9b4;--opus:#ff9933;--fable:#a58bff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:600 14px/1 system-ui,-apple-system,"Segoe UI",Roboto,"Ubuntu Sans",sans-serif;overflow:hidden}
.bar{height:52px;display:flex;align-items:center;gap:8px;padding:0 10px;padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line)}
.bar a{color:inherit;text-decoration:none}
.back{flex:none;padding:9px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tabs{flex:1;display:flex;justify-content:center;gap:4px;min-width:0}
.tabs a{display:flex;align-items:center;gap:7px;padding:9px 11px;border-radius:999px;color:var(--muted);white-space:nowrap}
.tabs a .d{width:9px;height:9px;border-radius:50%}
.tabs a[aria-current]{background:#1b212c;color:var(--text);box-shadow:inset 0 0 0 1px var(--c)}
#stage{position:relative;height:calc(100% - 52px);background:#000}
#stage iframe{display:block;position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-weight:700;letter-spacing:.04em;pointer-events:none;transition:opacity .3s}
#loading.off{opacity:0}
@media (max-width:420px){.back span,.tabs a .v{display:none}.tabs a{padding:9px 9px}.bar{gap:6px;padding:0 8px}}
/* phones and tablets: one button tucks every control away (this bar and the scene's own panels) and brings them back */
#ctl{display:none;position:fixed;z-index:10;top:calc(env(safe-area-inset-top) + 8px);right:10px;width:36px;height:36px;padding:0;place-items:center;border-radius:50%;border:1px solid var(--line);background:rgba(11,13,18,.72);color:var(--text);cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:opacity .2s}
#ctl svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#ctl .on{display:none}
body.min #ctl .off{display:none}
body.min #ctl .on{display:block}
body.min #ctl{opacity:.7}
body.min .bar{display:none}
body.min #stage{height:100%}
@media (max-width:820px),(pointer:coarse){#ctl{display:grid}.bar{padding-right:54px}}
</style>
</head>
<body>
<div class="bar">
  <a class="back" href="./" aria-label="Back to all three">←<span> All 3</span></a>
  <nav class="tabs" aria-label="Choose model">
    <a href="?m=sonnet" data-m="sonnet" style="--c:var(--sonnet)"><span class="d" style="background:var(--sonnet)"></span>Sonnet<span class="v"> 5.5</span></a>
    <a href="?m=opus" data-m="opus" style="--c:var(--opus)"><span class="d" style="background:var(--opus)"></span>Opus<span class="v"> 5.5</span></a>
    <a href="?m=fable" data-m="fable" style="--c:var(--fable)"><span class="d" style="background:var(--fable)"></span>Fable<span class="v"> 5.2</span></a>
  </nav>
</div>
<button id="ctl" type="button" aria-pressed="false" aria-label="Hide controls" title="Hide controls">
  <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg>
  <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
</button>
<div id="stage"><div id="loading" role="status">Loading…</div></div>
<script>
/* One scene at a time. Switching fully tears down the previous scene before the next one starts:
   its WebGL context is released explicitly (GPU memory is freed at once, not whenever GC runs),
   its render loop is stopped, and the iframe is destroyed and replaced with a fresh one. */
const NAMES = { sonnet: 'Sonnet 5.5', opus: 'Opus 5.5', fable: 'Fable 5.2' };
const stage = document.getElementById('stage'), loading = document.getElementById('loading');
let frame = null, current = null, token = 0;

function release(f) {
  if (!f) return;
  try {
    const w = f.contentWindow, d = f.contentDocument;
    if (w) { w.requestAnimationFrame = () => 0; w.cancelAnimationFrame && w.cancelAnimationFrame(0); }
    if (d) {
      d.querySelectorAll('canvas').forEach(c => {
        for (const type of ['webgl2', 'webgl']) {
          let gl = null; try { gl = c.getContext(type); } catch (e) {}
          if (gl) { try { const ext = gl.getExtension('WEBGL_lose_context'); ext && ext.loseContext(); } catch (e) {} break; }
        }
        c.width = c.height = 1;
      });
      d.querySelectorAll('video,audio').forEach(m => { try { m.pause(); m.removeAttribute('src'); m.load(); } catch (e) {} });
    }
  } catch (e) {}
  try { f.src = 'about:blank'; } catch (e) {}
  f.remove();
}

const nextFrame = () => new Promise(r => requestAnimationFrame(() => r()));
const wait = ms => new Promise(r => setTimeout(r, ms));

async function show(m, push) {
  if (!NAMES[m]) m = 'sonnet';
  document.querySelectorAll('.tabs a').forEach(a => a.toggleAttribute('aria-current', a.dataset.m === m));
  document.title = NAMES[m] + ' · India Gate AI Showdown';
  if (push) history.pushState({ m }, '', '?m=' + m);
  if (m === current && frame) return;
  const my = ++token; current = m;
  release(frame); frame = null;
  loading.textContent = 'Loading ' + NAMES[m] + '…'; loading.classList.remove('off');
  await nextFrame(); await nextFrame(); await wait(150);       // let the browser reclaim the old scene first
  if (my !== token) return;                                    // a newer click won
  const f = document.createElement('iframe');
  f.title = NAMES[m] + ' 3D scene'; f.allow = 'fullscreen; autoplay'; f.allowFullscreen = true;
  f.addEventListener('load', () => { if (f !== frame) return; applyMin(f); loading.classList.add('off'); try { f.contentWindow.focus(); } catch (e) {} });
  f.src = m + '/';
  stage.appendChild(f); frame = f;
}

/* Hide / show controls. The scenes are served from this same site, so a style tag dropped into the
   scene's document hides its panels at runtime; the scene files themselves are never changed.
   All three keep their controls in #ui (Opus also has a #toast); the canvas and loading screens are untouched.
   The choice carries over when switching models. */
const ctl = document.getElementById('ctl');
const MIN_CSS = '#ui,#toast{opacity:0!important;visibility:hidden!important;pointer-events:none!important}';
let minimized = false;
function applyMin(f) {
  try {
    const d = f && f.contentDocument; if (!d || !d.documentElement) return;
    let s = d.getElementById('ig-min');
    if (minimized && !s) { s = d.createElement('style'); s.id = 'ig-min'; s.textContent = MIN_CSS; (d.head || d.documentElement).appendChild(s); }
    else if (!minimized && s) s.remove();
  } catch (e) {}
}
function setMin(on) {
  minimized = on; document.body.classList.toggle('min', on);
  const label = on ? 'Show controls' : 'Hide controls';
  ctl.setAttribute('aria-pressed', String(on)); ctl.setAttribute('aria-label', label); ctl.title = label;
  applyMin(frame);
}
ctl.onclick = () => { setMin(!minimized); try { frame && frame.contentWindow.focus(); } catch (e) {} };

document.querySelectorAll('.tabs a').forEach(a => a.onclick = e => { e.preventDefault(); show(a.dataset.m, true); });
addEventListener('popstate', () => show(new URLSearchParams(location.search).get('m')));
/* leaving the page (back to the cards, another tab, bfcache): free the scene; restore it if the page comes back */
addEventListener('pagehide', () => { token++; release(frame); frame = null; current = null; });
addEventListener('pageshow', e => { if (e.persisted || !frame) show(new URLSearchParams(location.search).get('m')); });
</script>
</body>
</html>
