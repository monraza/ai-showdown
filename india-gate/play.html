<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Play · India Gate AI Showdown</title>
<meta name="description" content="Play the India Gate 3D scenes built by Claude Sonnet 5.5, Opus 5.5 and Fable 5.2 from the same prompt.">
<meta property="og:title" content="Same prompt. 3 Claude models. Which built India Gate best?">
<meta property="og:image" content="https://monraza.github.io/ai-showdown/india-gate/media/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://monraza.github.io/ai-showdown/india-gate/media/og.jpg">
<meta name="theme-color" content="#111317">
<link rel="stylesheet" href="../glass.css?v=1">
<style>
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column;height:100dvh}
:root{--sonnet:#38c9b4;--opus:#ff9933;--fable:#a58bff}
/* the site header, same as the main page */
.head{flex:none;padding:calc(env(safe-area-inset-top) + 12px) 12px 0}
header.top{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 8px 8px 10px;background:var(--glass-popover)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;color:var(--ink);text-decoration:none;font:600 15px/20px var(--font-sans);letter-spacing:-.01em}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top nav{display:flex;align-items:center;gap:4px}
/* under the header: full screen on the left, the model switch in the middle, the controls button on the right */
.models{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;max-width:1080px;width:100%;margin:0 auto;padding:10px 12px}
.models .tabs{grid-column:2}
#fs{grid-column:1;justify-self:start}
#ctl{grid-column:3;justify-self:end}
.tabs a{height:28px;padding:0 11px}
.tabs a .bx-dot{width:8px;height:8px}
/* the scene: always dark behind the canvas */
#stage{position:relative;flex:1;min-height:0;background:#000}
#stage iframe{display:block;position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-muted);font:600 13px/18px var(--font-sans);pointer-events:none;transition:opacity .3s}
#loading.off{opacity:0}
/* square icon buttons; pressed = accent outline and tint */
.ib{width:30px;height:30px;padding:0;border:1.5px solid transparent;border-radius:var(--radius-sm);background:var(--fill);color:var(--ink)}
.ib svg{width:16px;height:16px}
.ib[aria-pressed="true"]{border-color:var(--accent-line);background:var(--accent-wash);color:var(--accent-ink)}
/* phones and tablets: the scene's own controls start hidden; the controls button shows them (pressed) and hides them again */
.ctl{display:none}
@media (max-width:820px),(pointer:coarse){.ctl{display:inline-flex}}
/* full screen: the stage fills the screen; a small floating bar inside it, mid-way down the right edge where the scenes keep no panels,
   holds the controls button and the way out */
.fsbar{display:none;position:absolute;z-index:3;top:50%;transform:translateY(-50%);right:calc(env(safe-area-inset-right) + 8px);flex-direction:column;gap:6px;padding:4px;border-radius:var(--radius-md);background:var(--glass-popover);border:1px solid var(--edge);-webkit-backdrop-filter:blur(var(--blur-glass)) saturate(170%);backdrop-filter:blur(var(--blur-glass)) saturate(170%)}
.fsbar .ib:not([aria-pressed="true"]){background:transparent}
#stage:fullscreen{width:100%;height:100%}
#stage:fullscreen .fsbar{display:flex}
#stage:-webkit-full-screen .fsbar{display:flex}
body.fs .fsbar{display:flex}
body.fs .head,body.fs .models{display:none}            /* phones without the Fullscreen API (iPhone): the stage covers the page */
body.fs #stage{position:fixed;inset:0;z-index:20}
@media (max-width:760px){header.top nav .bx-btn--plain{padding:0 10px}}
@media (max-width:420px){.brand .long,.tabs a .v{display:none}.tabs a{padding:0 10px}}
</style>
</head>
<body class="bx-page">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-arch" viewBox="0 0 24 24"><path d="M6 20V9h12v11M10 20v-5a2 2 0 0 1 4 0v5M4 6h16"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
  <symbol id="i-shrink" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
</svg>
<div class="head">
  <header class="top bx-glass">
    <a class="brand" href="./"><span class="bx-tile bx-tile--attention"><svg class="bx-icon"><use href="#i-arch"/></svg></span><span class="name">India Gate<span class="long"> · AI Showdown</span></span></a>
    <nav aria-label="Page">
      <a class="bx-btn bx-btn--plain" href="./#play">Play</a>
      <a class="bx-btn bx-btn--plain" href="./#prompt">Prompt</a>
      <a class="bx-btn bx-btn--plain" href="https://x.com/_monisraza" target="_blank" rel="noopener">Follow</a>
    </nav>
  </header>
</div>
<div class="models">
  <button class="bx-btn ib" id="fs" type="button" aria-label="Full screen" title="Full screen"><svg class="bx-icon"><use href="#i-expand"/></svg></button>
  <nav class="tabs bx-segmented" aria-label="Choose model">
    <a href="?m=sonnet" data-m="sonnet"><span class="bx-dot" style="background:var(--sonnet)"></span>Sonnet<span class="v"> 5.5</span></a>
    <a href="?m=opus" data-m="opus"><span class="bx-dot" style="background:var(--opus)"></span>Opus<span class="v"> 5.5</span></a>
    <a href="?m=fable" data-m="fable"><span class="bx-dot" style="background:var(--fable)"></span>Fable<span class="v"> 5.2</span></a>
  </nav>
  <button class="bx-btn ib ctl" id="ctl" type="button" aria-pressed="false" aria-label="Show controls" title="Show controls"><svg class="bx-icon"><use href="#i-sliders"/></svg></button>
</div>
<div id="stage" class="bx-dark"><div id="loading" role="status">Loading…</div>
  <div class="fsbar">
    <button class="bx-btn ib ctl" type="button" aria-pressed="false" aria-label="Show controls" title="Show controls"><svg class="bx-icon"><use href="#i-sliders"/></svg></button>
    <button class="bx-btn ib" id="fsExit" type="button" aria-label="Exit full screen" title="Exit full screen"><svg class="bx-icon"><use href="#i-shrink"/></svg></button>
  </div>
</div>
<script>
/* One scene at a time. Switching fully tears down the previous scene before the next one starts:
   its WebGL context is released explicitly (GPU memory is freed at once, not whenever GC runs),
   its render loop is stopped, and the iframe is destroyed and replaced with a fresh one. */
const NAMES = { sonnet: 'Sonnet 5.5', opus: 'Opus 5.5', fable: 'Fable 5.2' };
const stage = document.getElementById('stage'), loading = document.getElementById('loading');
let frame = null, current = null, token = 0;

function release(f) {
  if (!f) return;
  try {
    const w = f.contentWindow, d = f.contentDocument;
    if (w) { w.requestAnimationFrame = () => 0; w.cancelAnimationFrame && w.cancelAnimationFrame(0); }
    if (d) {
      d.querySelectorAll('canvas').forEach(c => {
        for (const type of ['webgl2', 'webgl']) {
          let gl = null; try { gl = c.getContext(type); } catch (e) {}
          if (gl) { try { const ext = gl.getExtension('WEBGL_lose_context'); ext && ext.loseContext(); } catch (e) {} break; }
        }
        c.width = c.height = 1;
      });
      d.querySelectorAll('video,audio').forEach(m => { try { m.pause(); m.removeAttribute('src'); m.load(); } catch (e) {} });
    }
  } catch (e) {}
  try { f.src = 'about:blank'; } catch (e) {}
  if (f.__url) URL.revokeObjectURL(f.__url);
  f.remove();
}

const nextFrame = () => new Promise(r => requestAnimationFrame(() => r()));
const wait = ms => new Promise(r => setTimeout(r, ms));

/* Scene files are not served as plain HTML. Each is packed as <m>/scene.dat (XOR with this key;
   production/scripts/pack_scenes.py) and unpacked here in memory into a blob URL. The unpacked bytes are the
   scene file exactly as the model wrote it. It only discourages saving: a determined visitor can still get it. */
const SCENE_KEY = '5a6dd2336f69f7f8a21b64a22fa649c3688d7335d080987a';
async function sceneUrl(m) {
  const res = await fetch(m + '/scene.dat?v=2');
  if (!res.ok) throw new Error(res.status);
  const b = new Uint8Array(await res.arrayBuffer());
  const k = SCENE_KEY.match(/../g).map(h => parseInt(h, 16));
  for (let i = 0; i < b.length; i++) b[i] ^= k[i % k.length];
  return URL.createObjectURL(new Blob([b], { type: 'text/html' }));
}
/* no Save (Ctrl/Cmd+S), View source (Ctrl/Cmd+U) or right-click menu on the 3D page or inside the scene */
const guardKeys = e => { const k = (e.key || '').toLowerCase(); if ((e.ctrlKey || e.metaKey) && (k === 's' || k === 'u')) { e.preventDefault(); e.stopPropagation(); } };
const noMenu = e => e.preventDefault();
addEventListener('keydown', guardKeys, true);
stage.addEventListener('contextmenu', noMenu);
function guard(d) {
  if (d.__igGuard) return; d.__igGuard = true;
  d.addEventListener('keydown', guardKeys, true);
  d.addEventListener('contextmenu', noMenu, true);
}
/* Once a scene is running (its own loader marked done), drop its <script> tags: the code is already in memory,
   so a saved copy of the page gets none of it. */
function protect(f) {
  const t0 = performance.now();
  const tick = () => {
    if (f !== frame) return;
    try {
      const d = f.contentDocument;
      if (d && d.documentElement && d.URL === f.__url) {
        guard(d);
        if (d.querySelector('#loader.done,#veil.gone')) { d.querySelectorAll('script').forEach(s => s.remove()); return; }
      }
    } catch (e) { return; }
    if (performance.now() - t0 < 60000) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

async function show(m, push) {
  if (!NAMES[m]) m = 'sonnet';
  document.querySelectorAll('.tabs a').forEach(a => a.toggleAttribute('aria-current', a.dataset.m === m));
  document.title = NAMES[m] + ' · India Gate AI Showdown';
  if (push) history.pushState({ m }, '', '?m=' + m);
  if (m === current && frame) return;
  const my = ++token; current = m;
  release(frame); frame = null;
  loading.textContent = 'Loading ' + NAMES[m] + '…'; loading.classList.remove('off');
  await nextFrame(); await nextFrame(); await wait(150);       // let the browser reclaim the old scene first
  if (my !== token) return;                                    // a newer click won
  let url;
  try { url = await sceneUrl(m); }
  catch (e) { if (my === token) loading.textContent = 'Could not load ' + NAMES[m] + '. Please refresh the page.'; return; }
  if (my !== token) { URL.revokeObjectURL(url); return; }
  const f = document.createElement('iframe');
  f.title = NAMES[m] + ' 3D scene'; f.allow = 'fullscreen; autoplay'; f.allowFullscreen = true;
  f.addEventListener('load', () => { if (f !== frame) return; applyMin(f); loading.classList.add('off'); try { f.contentWindow.focus(); } catch (e) {} });
  f.__url = url; f.src = url;
  stage.appendChild(f); frame = f;
  dayFirst(f, m);
  protect(f);
  /* hide the panels as soon as the scene's document exists, not only at load. The check runs just before
     every frame is drawn (the iframe shares this page's rendering), so the panels are never painted on phones. */
  const early = () => {
    if (f !== frame) return;
    try {
      const d = f.contentDocument;
      if (d && d.documentElement && d.URL === f.__url) { applyMin(f); if (d.readyState === 'complete') return; }
    } catch (e) { return; }
    requestAnimationFrame(early);
  };
  requestAnimationFrame(early);
}

/* Day first. Opus and Fable start in day by themselves (their v3 files, re-prompted). Sonnet starts in golden hour,
   and that choice lives in its own code, which is never changed. Instead, when Sonnet finishes loading, this page
   switches it to day through the controls it exposes (window.__app.setMode, instant), while the scene's own loading
   screen is held for two frames, so golden hour is never seen.
   The hold only applies once the scene marks its loader done, so its own error message is never hidden. */
const HOLD_CSS = '#loader.done{opacity:1!important;visibility:visible!important}';
const DAY = {
  sonnet: { ready: d => d.querySelector('#loader.done'), go: w => { w.__app.setMode('day', { instant: true, silent: true }); return [0, 2]; } },
};
function dayFirst(f, m) {
  const day = DAY[m], t0 = performance.now();
  if (!day) return;   // the scene already starts in day
  let hold = null;
  const release = () => { try { hold && hold.remove(); } catch (e) {} };
  const tick = () => {
    if (f !== frame) return;
    try {
      const w = f.contentWindow, d = f.contentDocument;
      if (d && d.documentElement && d.URL === f.__url) {
        if (!hold) { hold = d.createElement('style'); hold.id = 'ig-hold'; hold.textContent = HOLD_CSS; (d.head || d.documentElement).appendChild(hold); }
        if (day.ready(d)) {
          let ms = 0, frames = 2; try { [ms, frames] = day.go(w, d); } catch (e) {}
          const until = performance.now() + ms;
          const settle = () => { if (f !== frame) return; if (--frames > 0 || performance.now() < until) requestAnimationFrame(settle); else release(); };
          requestAnimationFrame(settle);
          return;
        }
      }
    } catch (e) { return release(); }
    if (performance.now() - t0 < 60000) requestAnimationFrame(tick); else release();
  };
  requestAnimationFrame(tick);
}

/* Show / hide controls. The scenes are served from this same site, so a style tag dropped into the
   scene's document hides its panels at runtime; the scene files themselves are never changed.
   All three keep their controls in #ui (Opus also has a #toast); the canvas and loading screens are untouched.
   Phones and tablets start with the panels hidden and the controls button unpressed; pressing it shows them.
   Desktop always shows them (the button is not shown there). The choice carries over when switching models. */
const ctls = document.querySelectorAll('.ctl');
const small = matchMedia('(max-width:820px),(pointer:coarse)');
const MIN_CSS = '#ui,#toast{opacity:0!important;visibility:hidden!important;pointer-events:none!important}';
let minimized = small.matches;
function applyMin(f) {
  try {
    const d = f && f.contentDocument; if (!d || !d.documentElement) return;
    let s = d.getElementById('ig-min');
    if (minimized && !s) { s = d.createElement('style'); s.id = 'ig-min'; s.textContent = MIN_CSS; (d.head || d.documentElement).appendChild(s); }
    else if (!minimized && s) s.remove();
  } catch (e) {}
}
function setMin(on) {
  minimized = on;
  const label = on ? 'Show controls' : 'Hide controls';
  ctls.forEach(b => { b.setAttribute('aria-pressed', String(!on)); b.setAttribute('aria-label', label); b.title = label; });
  applyMin(frame);
}
setMin(minimized);
ctls.forEach(b => b.onclick = () => { setMin(!minimized); try { frame && frame.contentWindow.focus(); } catch (e) {} });
small.addEventListener('change', () => setMin(small.matches));   // rotating a tablet, resizing a window

/* Full screen: the stage (the scene's own page plus the small floating bar) fills the screen.
   Uses the Fullscreen API where the browser has it for page elements; iPhone Safari does not,
   so there the stage simply covers the page until the exit button is pressed. */
const fsBtn = document.getElementById('fs'), fsExit = document.getElementById('fsExit');
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement || null;
function enterFs() {
  const req = stage.requestFullscreen || stage.webkitRequestFullscreen;
  const fallback = () => document.body.classList.add('fs');
  if (!req) return fallback();
  try { const r = req.call(stage, { navigationUI: 'hide' }); if (r && r.catch) r.catch(fallback); } catch (e) { fallback(); }
}
function exitFs() {
  if (document.body.classList.contains('fs')) document.body.classList.remove('fs');
  else if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
}
fsBtn.onclick = () => { enterFs(); try { frame && frame.contentWindow.focus(); } catch (e) {} };
fsExit.onclick = () => exitFs();
addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('fs')) exitFs(); });

document.querySelectorAll('.tabs a').forEach(a => a.onclick = e => { e.preventDefault(); show(a.dataset.m, true); });
addEventListener('popstate', () => show(new URLSearchParams(location.search).get('m')));
/* leaving the page (back to the cards, another tab, bfcache): free the scene; restore it if the page comes back */
addEventListener('pagehide', () => { token++; release(frame); frame = null; current = null; });
addEventListener('pageshow', e => { if (e.persisted || !frame) show(new URLSearchParams(location.search).get('m')); });
</script>
</body>
</html>
