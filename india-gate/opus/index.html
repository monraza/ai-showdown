<html lang="en">

<style>

    .tri { width: 64px; margin: 7px 0 7px; }
    #title p { font-size: 10.5px; }
    #title p.coords { display: none; }
    #title .mode { font-size: 9px; margin-top: 6px; padding-top: 6px; }

/* Boot: install the import map (unpkg first, jsDelivr as a fallback), then start the app.
   Any failure is reported on the splash screen instead of leaving it spinning. */
(function () {
  const loader = document.getElementById('loader'), msgEl = document.getElementById('loaderMsg'), errEl = document.getElementById('loaderErr');
  const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  let failed = false;
  window.__igFail = function (title, detail) {
    if (failed || loader.classList.contains('done')) return;
    failed = true; loader.classList.add('error');
    msgEl.textContent = 'Could not start the scene';
    errEl.innerHTML = '<b>' + esc(title) + '</b>' + (detail ? '<br><code>' + esc(detail) + '</code>' : '');
    errEl.style.display = 'block';
  };
  addEventListener('error', e => {
    const m = (e && (e.message || (e.error && e.error.message))) || 'Unknown script error';
    if (/webgl/i.test(m)) window.__igFail('WebGL is not available in this browser or viewer. Try a current Chrome, Edge, Firefox or Safari with hardware acceleration enabled.', m);
    else window.__igFail('A script error stopped the scene from loading.', m);
  });
  addEventListener('unhandledrejection', e => window.__igFail('A script error stopped the scene from loading.', (e.reason && (e.reason.message || e.reason)) || ''));
  if (!(window.HTMLScriptElement && HTMLScriptElement.supports && HTMLScriptElement.supports('importmap'))) {
    window.__igFail('This browser does not support import maps. Please open the page in a current version of Chrome, Edge, Firefox or Safari (16.4+).');
    return;
  }
  const CDNS = ['https://unpkg.com/three@0.160.0/', 'https://cdn.jsdelivr.net/npm/three@0.160.0/'];
  const probe = base => new Promise((res, rej) => {
    const ctl = window.AbortController ? new AbortController() : null;
    const timer = setTimeout(() => { if (ctl) ctl.abort(); rej(new Error('timeout')); }, 7000);
    fetch(base + 'build/three.module.js', { method: 'HEAD', mode: 'cors', cache: 'force-cache', signal: ctl ? ctl.signal : undefined })
      .then(r => { clearTimeout(timer); r.ok ? res(base) : rej(new Error('HTTP ' + r.status)); }, err => { clearTimeout(timer); rej(err); });
  });
  const start = base => {
    const map = document.createElement('script');
    map.type = 'importmap';
    map.textContent = JSON.stringify({ imports: { three: base + 'build/three.module.js', 'three/addons/': base + 'examples/jsm/' } });
    document.head.appendChild(map);
    const app = document.createElement('script');
    app.type = 'module';
    app.textContent = document.getElementById('app').textContent;
    document.body.appendChild(app);
    setTimeout(() => { if (!loader.classList.contains('done')) window.__igFail('The scene is taking unusually long to load.', 'Check the browser console for details.'); }, 45000);
  };
  (async () => {
    for (const base of CDNS) { try { start(await probe(base)); return; } catch (e) { /* try next CDN */ } }
    window.__igFail('Three.js could not be downloaded from unpkg.com or cdn.jsdelivr.net.',
      'This page needs an internet connection. If you opened it inside an app preview or a sandboxed viewer that blocks external scripts, save the file and open it directly in a web browser.');
  })();
})();

  const bowl = new THREE.LatheGeometry(prof, 56); bowl.translate(0, BOWL_Y, 0); L.smooth.push(bowl);

  addMesh(L.buff, M.buff, 6, true, true, group);
  addMesh(L.smooth, M.smooth, 3, true, true, group);
  addMesh(L.names, M.names, null, false, true, group);
  addMesh(L.sun, M.sun, null, false, true, group);
  for (const sz of [-1, 1]) {

  }

  });

    for (const ox of [-256, 0, 256]) for (const oy of [-256, 0, 256]) {

  const L = { marble: [], granite: [], urn: [], metal: [], wood: [], helm: [] };

    spotCol: C(0xffb070), spotInt: 1, canopyFlood: 1.2, farFlood: 1, fountain: 1, fountCol: C(0xffd6a0), hazeAmt: 1, jyoti: 1.4,
  },
  tri: {
    sunElev: -14, sunAzim: 22, turbidity: 2, rayleigh: 0.6, mie: 0.003, mieG: 0.8,
    keyElev: 21, keyAzim: 150, keyColor: C(0x9db2ff), keyInt: 0.36,
    hemiSky: C(0x283456), hemiGround: C(0x14120f), hemiInt: 0.5,
    fogColor: C(0x14172a), fogDensity: 0.0013, exposure: 0.72,
    bloomStrength: 0.6, bloomRadius: 0.55, bloomThreshold: 0.72,
    night: 1, stars: 1, moon: 1, flood: 0.06, tri: 1, lamps: 0.85, dust: 0, fly: 0.8, birds: 0, flame: 1, beams: 1,
    waterDeep: C(0x04070d), waterSky: C(0x161c28), glowCol: C(0x9effb0), glowAmt: 0.42,
    spotCol: C(0xdfe6ff), spotInt: 0.25, canopyFlood: 0.9, farFlood: 0.8, fountain: 1, fountCol: C(0xc8ffd8), hazeAmt: 1, jyoti: 1.3,
  },
};
const MODE_LABEL = { day: 'Day', golden: 'Golden hour', night: 'Night', tri: 'Tricolour' };
const MODE_DOT = { day: '#ffe08a', golden: '#FF9933', night: '#9db8ff', tri: '#FF9933' };
const clone = o => { const r = {}; for (const k in o) r[k] = o[k].isColor ? o[k].clone() : o[k]; return r; };
const cur = clone(MODES.golden);
let fromP = null, toP = null, mStart = 0, currentMode = 'golden';
const MDUR = 2.4;
const sunV = new THREE.Vector3(), keyV = new THREE.Vector3(), tmpC = new THREE.Color();
function setMode(name) {
  if (!MODES[name]) return;
  fromP = clone(cur); toP = MODES[name]; mStart = clock.elapsedTime; currentMode = name;
  document.querySelectorAll('#lightGroup button').forEach(b => b.classList.toggle('active', b.dataset.mode === name));
  document.getElementById('modeLabel').textContent = MODE_LABEL[name];
  const dot = document.getElementById('modeDot');
  dot.style.background = name === 'tri' ? 'conic-gradient(#FF9933 0 33%, #ffffff 0 66%, #138808 0)' : MODE_DOT[name];
  dot.style.boxShadow = `0 0 10px ${MODE_DOT[name]}`;
}
function stepMode(now) {
  if (!toP) return false;
  const k = Math.min(1, (now - mStart) / MDUR), e = ease(k);
  for (const key in toP) {
    if (toP[key].isColor) cur[key].copy(fromP[key]).lerp(toP[key], e);
    else cur[key] = fromP[key] + (toP[key] - fromP[key]) * e;
  }
  if (k >= 1) toP = null;
  return true;
}
function applyMode() {
  const P = cur;
  sunV.setFromSphericalCoords(1, (90 - P.sunElev) * DEG, P.sunAzim * DEG);
  const su = sky.material.uniforms;
  su.sunPosition.value.copy(sunV); su.turbidity.value = P.turbidity; su.rayleigh.value = P.rayleigh;
  su.mieCoefficient.value = P.mie; su.mieDirectionalG.value = P.mieG;
  keyV.setFromSphericalCoords(1, (90 - P.keyElev) * DEG, P.keyAzim * DEG);
  key.position.copy(key.target.position).addScaledVector(keyV, 360);
  key.color.copy(P.keyColor); key.intensity = P.keyInt;
  hemi.color.copy(P.hemiSky); hemi.groundColor.copy(P.hemiGround); hemi.intensity = P.hemiInt;
  scene.fog.color.copy(P.fogColor); scene.fog.density = P.fogDensity;
  renderer.toneMappingExposure = P.exposure;
  bloom.strength = P.bloomStrength; bloom.radius = P.bloomRadius; bloom.threshold = P.bloomThreshold;
  domeMat.uniforms.uAmt.value = P.night; domeMat.uniforms.uHorizon.value.copy(P.fogColor);
  hazeMat.uniforms.uCol.value.copy(P.fogColor); hazeMat.uniforms.uAmt.value = P.hazeAmt;
  starMat.uniforms.uOpacity.value = P.stars;
  moon.material.opacity = P.moon; halo.material.opacity = P.moon * 0.3;
  moonDir.setFromSphericalCoords(1, (90 - 21) * DEG, 150 * DEG);
  moon.position.copy(moonDir).multiplyScalar(2400); halo.position.copy(moon.position);
  gateU.uFlood.value = P.flood; gateU.uTri.value = P.tri;
  canopyU.uFlood.value = P.canopyFlood; farU.uFlood.value = P.farFlood;
  globeMat.emissiveIntensity = P.lamps * 2.4;
  poolMat.opacity = P.lamps * 0.32;
  flyMat.uniforms.uAmt.value = P.fly; dustMat.uniforms.uAmt.value = P.dust;
  fountMat.uniforms.uAmt.value = P.fountain; fountMat.uniforms.uColor.value.copy(P.fountCol);
  for (const m of [flyMat, dustMat, fountMat]) m.uniforms.uFogD.value = P.fogDensity;
  kiteMat.opacity = P.birds; for (const k of kites) k.g.visible = P.birds > 0.02;
  flameMat.uniforms.uAmt.value = P.flame; flame.visible = P.flame > 0.01;
  for (const b of beams) { b.material.uniforms.uAmt.value = P.beams; b.visible = P.beams > 0.01; }
  const wu = waterMat.uniforms;
  wu.uDeep.value.copy(P.waterDeep); wu.uSkyCol.value.copy(P.waterSky); wu.uSunDir.value.copy(keyV);
  wu.uSunCol.value.copy(P.keyColor).multiplyScalar(P.keyInt * 0.5); wu.uLampAmt.value = P.lamps * 0.5;
  wu.uFogCol.value.copy(P.fogColor); wu.uFogD.value = P.fogDensity;
  gateGlowMat.color.copy(P.glowCol); gateGlowMat.opacity = P.glowAmt;
  lensMat.color.copy(P.spotCol).multiplyScalar(0.06 + P.spotInt * 3 + P.tri * 2.5);
  canopyLight.intensity = P.canopyFlood * 70;
  for (const m of jyoti.mats) m.uniforms.uAmt.value = 0.75 + 0.25 * Math.min(1, P.jyoti);
}

/* ------------------------------------------------------------------ *
 *  Camera & controls
 * ------------------------------------------------------------------ */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 6; controls.maxDistance = 330;
controls.minPolarAngle = 0.06; controls.maxPolarAngle = Math.PI * 0.9;
controls.autoRotate = true; controls.autoRotateSpeed = 0.55;
controls.screenSpacePanning = true; controls.panSpeed = 0.7; controls.zoomSpeed = 0.9;
controls.target.set(0, 20, 0);
const PRESETS = {
  front: { pos: [0, 6, 92], target: [0, 20, 0] },
  corner: { pos: [-40, 9, 56], target: [0, 20, 0] },
  lookup: { pos: [7, 1.7, 18], target: [0, 30, -1] },
  arch: { pos: [0, 3.0, 52], target: [0, 10.5, -66] },
  rear: { pos: [-34, 14, -122], target: [0, 15, -12] },
  aerial: { pos: [110, 150, 140], target: [0, 4, 0] },
};
let autoOrbit = true, tween = null;
function setAutoOrbit(on) {
  autoOrbit = on;
  document.getElementById('orbitBtn').classList.toggle('on', on);
}
function camActive(name) { document.querySelectorAll('#camGroup button[data-cam]').forEach(b => b.classList.toggle('active', b.dataset.cam === name)); }
function flyTo(pos, target, dur = 1.8) {
  const t0 = controls.target.clone(), t1 = new THREE.Vector3(...target);
  const s0 = new THREE.Spherical().setFromVector3(camera.position.clone().sub(t0));
  const s1 = new THREE.Spherical().setFromVector3(new THREE.Vector3(...pos).sub(t1));
  let dth = s1.theta - s0.theta;
  while (dth > Math.PI) dth -= Math.PI * 2;
  while (dth < -Math.PI) dth += Math.PI * 2;
  tween = { t0, t1, s0, s1, dth, start: clock.elapsedTime, dur };
}
const tmpS = new THREE.Spherical(), tmpV = new THREE.Vector3();
function stepTween(now) {
  if (!tween) return;
  const k = Math.min(1, (now - tween.start) / tween.dur), e = ease(k);
  controls.target.lerpVectors(tween.t0, tween.t1, e);
  tmpS.set(tween.s0.radius + (tween.s1.radius - tween.s0.radius) * e, tween.s0.phi + (tween.s1.phi - tween.s0.phi) * e, tween.s0.theta + tween.dth * e);
  camera.position.copy(controls.target).add(tmpV.setFromSpherical(tmpS));
  if (k >= 1) tween = null;
}

/* ------------------------------------------------------------------ *
 *  UI wiring
 * ------------------------------------------------------------------ */
const ui = document.getElementById('ui'), toastEl = document.getElementById('toast');
let toastTimer = 0;
function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600); }
document.querySelectorAll('#lightGroup button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
document.querySelectorAll('#camGroup button[data-cam]').forEach(b => b.addEventListener('click', () => {
  const p = PRESETS[b.dataset.cam]; setAutoOrbit(false); flyTo(p.pos, p.target, 1.8); camActive(b.dataset.cam);
}));
document.getElementById('orbitBtn').addEventListener('click', () => setAutoOrbit(!autoOrbit));
addEventListener('keydown', (e) => {
  if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k >= '1' && k <= '4') { const m = ['day', 'golden', 'night', 'tri'][+k - 1]; setMode(m); if (ui.classList.contains('hidden')) toast(MODE_LABEL[m]); }
  else if (k === 'r') { setAutoOrbit(!autoOrbit); toast(autoOrbit ? 'Auto-orbit on' : 'Auto-orbit off'); }
  else if (k === 'h') { ui.classList.toggle('hidden'); toast(ui.classList.contains('hidden') ? 'UI hidden · press H to show' : 'UI visible'); }
});
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
addEventListener('pointerup', () => { down = null; });
addEventListener('pointercancel', () => { down = null; });
renderer.domElement.addEventListener('pointermove', e => {
  if (!down) return;
  if (Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 4) {
    if (autoOrbit) setAutoOrbit(false);
    tween = null; camActive(null); down = null;
  }
});
renderer.domElement.addEventListener('wheel', () => { if (tween) tween = null; camActive(null); }, { passive: true });
function onResize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h; camera.fov = fovFor(w / h); camera.updateProjectionMatrix();
  renderer.setSize(w, h); composer.setSize(w, h);
}
addEventListener('resize', onResize);

/* ------------------------------------------------------------------ *
 *  Animation loop
 * ------------------------------------------------------------------ */
const clock = new THREE.Clock();
const dmy = new THREE.Object3D();
const camFwd = new THREE.Vector3();
let frame = 0;
function animate() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  uTime.value = t;
  const changing = stepMode(t);
  applyMode();
  stepTween(t);
  controls.autoRotate = autoOrbit && !tween;
  controls.update(dt);
  if (camera.position.y < 1.0) camera.position.y = 1.0;
  controls.target.y = Math.min(Math.max(controls.target.y, 0), 70);
  if (controls.target.length() > 450) controls.target.setLength(450);
  skyFollow.position.copy(camera.position);

  // visitors
  people.forEach((p, i) => {
    let x, z, ry = 0, bob = 0;
    if (p.type === 'ring') { p.a += p.w * dt; if (p.a > p.hi || p.a < p.lo) { p.w *= -1; p.a = Math.min(Math.max(p.a, p.lo), p.hi); } x = Math.cos(p.a) * p.r; z = Math.sin(p.a) * p.r; ry = -p.a + (p.w > 0 ? 0 : Math.PI); bob = p.w ? Math.abs(Math.sin(t * 7 + p.ph)) * 0.05 : 0; }
    else if (p.type === 'av') { p.z += p.v * dt; if (p.z > 390 || p.z < 60) { p.v *= -1; p.z = Math.min(Math.max(p.z, 60), 390); } x = p.x; z = p.z; bob = Math.abs(Math.sin(t * 7 + p.ph)) * 0.05; }
    else { x = p.x; z = p.z; bob = Math.sin(t * 1.5 + p.ph) * 0.01; }
    dmy.position.set(x, 0.05 + (0.21 + 0.46) * p.s + bob, z); dmy.rotation.set(0, ry, 0); dmy.scale.setScalar(p.s); dmy.updateMatrix(); bodyM.setMatrixAt(i, dmy.matrix);
    dmy.position.y = 0.05 + 1.5 * p.s + bob; dmy.updateMatrix(); headM.setMatrixAt(i, dmy.matrix);
  });
  bodyM.instanceMatrix.needsUpdate = true; headM.instanceMatrix.needsUpdate = true;
  // balloons
  const la = balloons.lines.geometry.attributes.position;
  balloons.data.forEach((b, i) => {
    const sw = Math.sin(t * 1.1 + b.ph) * 0.25, sw2 = Math.cos(t * 0.9 + b.ph * 1.3) * 0.25;
    const x = b.ox + b.dx + sw, y = b.h + Math.sin(t * 1.7 + b.ph) * 0.08, z = b.oz + b.dz + sw2;
    dmy.position.set(x, y, z); dmy.rotation.set(sw * 0.4, 0, -sw2 * 0.4); dmy.scale.setScalar(1); dmy.updateMatrix(); balloons.mesh.setMatrixAt(i, dmy.matrix);
    la.setXYZ(i * 2, b.ox, 2.3, b.oz); la.setXYZ(i * 2 + 1, x, y - 0.35, z);
  });
  balloons.mesh.instanceMatrix.needsUpdate = true; la.needsUpdate = true;
  // kites wheeling on thermals
  if (cur.birds > 0.02) for (const k of kites) {
    k.a += k.w * dt;
    const x = k.cx + Math.cos(k.a) * k.r, z = k.cz + Math.sin(k.a) * k.r, y = k.h + Math.sin(t * 0.3 + k.ph) * 4;
    k.g.position.set(x, y, z);
    const tx = -Math.sin(k.a) * Math.sign(k.w), tz = Math.cos(k.a) * Math.sign(k.w);
    k.g.rotation.set(0, Math.atan2(tx, tz), 0);
    k.g.rotateZ(-Math.sign(k.w) * 0.32);
    const flap = Math.pow(Math.max(0, Math.sin(t * 0.45 + k.ph)), 8);
    const ang = 0.1 + Math.sin(t * 9 + k.ph) * 0.45 * flap;
    k.wr.rotation.z = ang; k.wl.rotation.z = -ang;
  }
  // flame + beams
  if (flame.visible) {
    camFwd.set(camera.position.x, 0, camera.position.z);
    flame.rotation.y = Math.atan2(camFwd.x, camFwd.z);
  }
  // Amar Jawan Jyoti: billboard + flicker
  const jf = 0.86 + 0.08 * Math.sin(t * 11.3) + 0.04 * Math.sin(t * 23.7 + 1.1) + 0.02 * Math.sin(t * 41.9 + 2.3);
  jyotiShared.uJyoti.value = cur.jyoti * jf;
  jyoti.glow.material.opacity = cur.jyoti * 0.32 * jf;
  jyoti.flames.forEach((f, i) => {
    f.rotation.y = Math.atan2(camera.position.x - f.position.x, camera.position.z - f.position.z);
    f.scale.set(1, 0.92 + 0.1 * Math.sin(t * (9 + i) + i * 2.1) + 0.04 * Math.sin(t * 21 + i), 1);
  });
  const flick = 0.82 + 0.12 * Math.sin(t * 13.1) + 0.06 * Math.sin(t * 27.3 + 1.7);
  flameLight.intensity = cur.flame * 140 * flick;
  for (const b of beams) if (b.visible) { b.rotation.z = b.userData.base + Math.sin(t * 0.35 + b.userData.phase) * 0.16; b.rotation.x = -0.18 + Math.sin(t * 0.27 + b.userData.phase) * 0.08; }

  for (const f of flags) {
    const p = f.geometry.attributes.position, b = f.userData.base;
    for (let i = 0; i < p.count; i++) {
      const x = b[i * 3], y = b[i * 3 + 1], k = x / 3.6;
      p.setXYZ(i, x - k * k * 0.18, y - k * 0.14 + Math.sin(x * 1.3 - t * 3 + f.userData.ph) * 0.04 * k, Math.sin(x * 1.7 - t * 4.2 + y * 0.4 + f.userData.ph) * 0.34 * k);
    }
    p.needsUpdate = true; f.geometry.computeVertexNormals();
  }

  frame++;
  if (changing || frame % (SMALL ? 4 : 2) === 0) renderer.shadowMap.needsUpdate = true;
  composer.render();
}

// intro
setMode('golden'); toP = null; Object.assign(cur, clone(MODES.golden));
setAutoOrbit(true);
applyMode();
renderer.shadowMap.needsUpdate = true;
flyTo([58, 16, 76], [0, 20, 0], 4.2);
renderer.setAnimationLoop(animate);
loaderMsg.textContent = 'Lighting the lamps…';
requestAnimationFrame(() => requestAnimationFrame(() => loaderEl.classList.add('done')));
</script>
