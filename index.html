<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Showdown</title>
<meta name="description" content="Same prompt, different Claude models. Interactive 3D builds compared side by side, by monisraza.">
<meta property="og:title" content="AI Showdown: same prompt, different Claude models">
<meta property="og:image" content="https://monraza.github.io/ai-showdown/india-gate/media/og.jpg">

<meta name="theme-color" content="#0b0d12">
<style>
:root{--bg:#0b0d12;--panel:#141821;--line:#232a36;--text:#f2efe6;--muted:#a3a9b6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:48px 16px}
h1{font-size:clamp(32px,6vw,48px);margin:0 0 8px;letter-spacing:-.02em}
p{color:var(--muted);margin:0 0 32px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;max-width:600px}
a.card img{width:100%;display:block;aspect-ratio:1200/630}
a.card div{padding:16px 18px;font-weight:800;font-size:20px}
a.card span{display:block;font-weight:400;font-size:15px;color:var(--muted)}
footer{margin-top:40px;color:var(--muted);font-size:14px}
footer a{color:var(--text)}
</style>
</head>
<body>
<div class="wrap">
  <h1>AI Showdown</h1>
  <p>Same prompt, different Claude models. Each build runs live in your browser.</p>
  <a class="card" href="india-gate/">
    <img src="india-gate/media/og.jpg" alt="India Gate scenes built by Sonnet 5.5, Opus 5.5 and Fable 5.2">
    <div>India Gate<span>Sonnet 5.5 vs Opus 5.5 vs Fable 5.2</span></div>
  </a>
  <footer>By monisraza · <a href="https://www.linkedin.com/in/monisraza" target="_blank" rel="noopener">LinkedIn</a> · <a href="https://x.com/_monisraza" target="_blank" rel="noopener">X</a></footer>
</div>
</body>
</html>
